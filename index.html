<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estacionamento IoT</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #95a5a6; color: #fff; }
    .pista { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 20px; background-color: #2c3e50; padding: 40px; border-radius: 8px; border: 3px dashed #f1c40f; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    .vaga { width: 140px; height: 220px; border: 6px solid #ecf0f1; border-top: none; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px 0; box-sizing: border-box; }
    .numero { font-size: 32px; font-weight: bold; color: #7f8c8d; }
    .carro { font-size: 70px; height: 80px; display: flex; align-items: center; justify-content: center; }
    .legenda { padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
    .livre .legenda { background-color: #2ecc71; color: #000; }
    .ocupada .legenda { background-color: #e74c3c; color: #fff; }
  </style>

  <!-- SDKs do Firebase para uso direto no navegador -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  
  <h1>Estacionamento Inteligente</h1>
  <div class="pista">

    <div class="vaga livre" id="v1">
      <div class="numero">1</div>
      <div class="carro" id="car1"></div>
      <div class="legenda" id="lbl1">LIVRE</div>
    </div>

    <div class="vaga livre" id="v2">
      <div class="numero">2</div>
      <div class="carro" id="car2"></div>
      <div class="legenda" id="lbl2">LIVRE</div>
    </div>

    <div class="vaga livre" id="v3">
      <div class="numero">3</div>
      <div class="carro" id="car3"></div>
      <div class="legenda" id="lbl3">LIVRE</div>
    </div>

  </div>

  <script>
    // Suas credenciais do Firebase configuradas
    const firebaseConfig = {
      apiKey: "AIzaSyAUsJS77zBp2cPP2sAeb2UN5Lre7_DtdPU",
      authDomain: "estacionamento-73497.firebaseapp.com",
      databaseURL: "https://estacionamento-73497-default-rtdb.firebaseio.com",
      projectId: "estacionamento-73497",
      storageBucket: "estacionamento-73497.firebasestorage.app",
      messagingSenderId: "25586185437",
      appId: "1:25586185437:web:b14c5c42fd7b63d60b1734"
    };
    
    // Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Escuta as alterações em tempo real
    database.ref('vagas').on('value', (snapshot) => {
      const dados = snapshot.val();
      if (dados) {
        atualizarVaga('v1', 'car1', 'lbl1', dados.vaga1);
        atualizarVaga('v2', 'car2', 'lbl2', dados.vaga2);
        atualizarVaga('v3', 'car3', 'lbl3', dados.vaga3);
      }
    });

    function atualizarVaga(vagaId, carroId, legendaId, ocupada) {
      const vagaEl = document.getElementById(vagaId);
      const carroEl = document.getElementById(carroId);
      const legendaEl = document.getElementById(legendaId);

      if (ocupada) {
        vagaEl.className = "vaga ocupada";
        carroEl.innerHTML = "🚘";
        legendaEl.innerHTML = "OCUPADA";
      } else {
        vagaEl.className = "vaga livre";
        carroEl.innerHTML = "";
        legendaEl.innerHTML = "LIVRE";
      }
    }
  </script>
</body>
</html>
